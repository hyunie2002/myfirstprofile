{{ if gt (len .AllTranslations) 1 }}
  {{ $currentLang := .Lang }}
  <div class="language-switcher" aria-label="Language switcher">
    {{ range $index, $translation := .AllTranslations }}
      {{ if gt $index 0 }}
        <span class="language-switcher__separator" aria-hidden="true">/</span>
      {{ end }}
      <a
        class="language-switcher__link{{ if eq $translation.Lang $currentLang }} language-switcher__link--active{{ end }}"
        href="{{ $translation.RelPermalink }}"
        lang="{{ $translation.Lang }}"
        {{ if eq $translation.Lang $currentLang }}aria-current="page"{{ end }}
      >
        {{ if eq $translation.Lang "ko" }}KOR{{ else }}ENG{{ end }}
      </a>
    {{ end }}
  </div>
{{ end }}
